# `make up`: the Rust service, the viewer, the Python baseline (for comparisons), Prometheus and Grafana.
name: pathology

services:
  service:
    image: pathology/service:local
    build: { context: ., dockerfile: docker/service.Dockerfile }
    environment:
      API_KEYS: ${API_KEYS:-viewer:local-dev-key-viewer-000001,loadtest:local-dev-key-loadtest-0001}
      WORKERS: ${WORKERS:-4}
      MAX_BATCH: ${MAX_BATCH:-32}
      MAX_WAIT_US: ${MAX_WAIT_US:-500}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600000}
      CORS_ORIGINS: http://localhost:8088,http://localhost:5173
      RUST_LOG: info,ort=warn
    volumes:
      - ./models:/models:ro
    ports: ["8080:8080"]
    restart: unless-stopped

  viewer:
    image: pathology/viewer:local
    build:
      context: .
      dockerfile: docker/viewer.Dockerfile
      args: { VITE_SERVICE_URL: "http://localhost:8080" }
    ports: ["8088:8080"]
    depends_on:
      service: { condition: service_healthy }
    restart: unless-stopped

  baseline:
    image: pathology/baseline:local
    build: { context: ., dockerfile: docker/baseline.Dockerfile }
    environment:
      API_KEYS: loadtest:local-dev-key-loadtest-0001
      MODEL_DIR: /models/pcam/1
      INTRA_THREADS: ${BASELINE_INTRA_THREADS:-4}
    volumes:
      - ./models:/models:ro
    ports: ["8090:8080"]
    profiles: [compare]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9097:9090"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-locally}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3007:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
